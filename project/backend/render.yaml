services:
  - type: web
    name: gk-quiz-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      # OPTIONAL. Leave unset to deploy without Redis — the server runs
      # fine on a single Render instance with an in-memory fallback for
      # caching, OTP storage, and the matchmaking queue. If you provision
      # a Redis instance later (Render Redis, Upstash, etc.), paste its
      # connection URL here to enable real Redis, shared caching, and
      # multi-instance Socket.IO support. Use rediss:// if the provider
      # requires TLS.
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
